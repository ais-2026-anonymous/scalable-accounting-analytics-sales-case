name: Publish accounting case site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check feedback contract
        run: node --test tests/coach.test.mjs tests/instructor.test.mjs
      - name: Check Python grading against public materials
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Require a pinned model publication
        run: python -c "import json,re; d=json.load(open('dist/model-host.json')); assert re.fullmatch('[a-f0-9]{40}', d['revision'] or ''), 'Publish the model and pin its commit before deploying'"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
